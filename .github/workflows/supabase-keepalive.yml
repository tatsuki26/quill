# Supabase の無料プロジェクトは一定期間アクセスがないとスリープすることがあるため、
# 毎日 REST API へ軽いリクエストを送り DB を起こしておく。
# GitHub の Repository secrets に VITE_SUPABASE_URL / VITE_SUPABASE_ANON_KEY を設定してください（deploy と同じ値で可）。
# プロジェクトが Paused の場合は Supabase ダッシュボードで Restore してから再実行すること。
#
# 注意: GitHub は「デフォルトブランチに60日間 push がない」と scheduled workflow を
# 自動的に disabled_inactivity にしてしまう。このワークフロー自身が動き続けていても
# リポジトリへの push がなければ無効化されてしまうため、最終コミットから30日以上経って
# いたら空コミットを push してリポジトリを「アクティブ」に保つ。
name: Supabase keep-alive

on:
  schedule:
    # 毎日 03:15 UTC（日本時間 12:15 頃）
    - cron: '15 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ping Supabase REST (transactions)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${SUPABASE_URL// }" ] || [ -z "${SUPABASE_ANON_KEY// }" ]; then
            echo "::error::Secrets VITE_SUPABASE_URL and VITE_SUPABASE_ANON_KEY must be set on this repository."
            exit 1
          fi

          BASE="$(printf '%s' "$SUPABASE_URL" | tr -d '[:space:]')"
          BASE="${BASE%/}"
          if [[ ! "$BASE" =~ ^https?:// ]]; then
            BASE="https://${BASE}"
          fi

          ENDPOINT="${BASE}/rest/v1/transactions?select=id&limit=1"
          echo "Pinging ${BASE}/rest/v1/transactions"

          MAX_ATTEMPTS=3
          RETRY_DELAY=30
          attempt=1
          code="000"
          curl_exit=0

          while [ "$attempt" -le "$MAX_ATTEMPTS" ]; do
            set +e
            code=$(curl -sS -o /dev/null -w "%{http_code}" \
              --connect-timeout 20 \
              --max-time 60 \
              -H "apikey: ${SUPABASE_ANON_KEY}" \
              -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
              "${ENDPOINT}")
            curl_exit=$?
            set -e

            if [ "$curl_exit" -eq 0 ] && [ "$code" = "200" ]; then
              echo "HTTP ${code} (attempt ${attempt}/${MAX_ATTEMPTS})"
              exit 0
            fi

            if [ "$curl_exit" -ne 0 ]; then
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: curl failed (exit ${curl_exit})"
            else
              echo "Attempt ${attempt}/${MAX_ATTEMPTS}: HTTP ${code}"
            fi

            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              echo "Retrying in ${RETRY_DELAY}s..."
              sleep "$RETRY_DELAY"
            fi
            attempt=$((attempt + 1))
          done

          if [ "$curl_exit" -eq 6 ]; then
            host="${BASE#https://}"
            host="${host#http://}"
            host="${host%%/*}"
            echo "::error::Could not resolve host '${host}'. The Supabase project is likely paused or deleted."
            echo "::error::Open https://supabase.com/dashboard , restore the project if it shows Paused, wait until Active, then re-run this workflow."
            exit 1
          fi

          if [ "$curl_exit" -ne 0 ]; then
            echo "::error::curl failed with exit code ${curl_exit}"
            exit 1
          fi

          echo "::error::Unexpected HTTP status ${code}"
          exit 1

      - name: Keep repository active (avoid workflow auto-disable)
        if: always()
        run: |
          set -euo pipefail

          LAST_COMMIT_EPOCH=$(git log -1 --format=%ct)
          NOW_EPOCH=$(date +%s)
          DAYS_SINCE=$(( (NOW_EPOCH - LAST_COMMIT_EPOCH) / 86400 ))
          echo "Days since last commit: ${DAYS_SINCE}"

          if [ "$DAYS_SINCE" -lt 30 ]; then
            echo "Repository was active within the last 30 days, skipping."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive (repository inactivity prevention)"
          git push origin HEAD:${GITHUB_REF_NAME}
